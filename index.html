<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王純琳 | 個人簡介</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* Custom vibrant animated gradient background */
        .bg-vibrant {
            background: linear-gradient(-45deg, #f6d365, #fda085, #ff9a9e, #fecfef);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-vibrant min-h-screen flex items-center justify-center p-6 antialiased">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 transform translate-y-10 opacity-0 transition-all duration-300 ease-in-out pointer-events-none">
        <div class="bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 text-sm font-medium">
            <i class="fa-solid fa-check-circle text-green-400"></i>
            <span id="toast-message">已複製！</span>
        </div>
    </div>

    <!-- Main Profile Card -->
    <main class="w-full max-w-md bg-white/95 backdrop-blur-xl rounded-[2.5rem] shadow-2xl p-8 pt-12 relative mt-16 text-center border border-white/50">
        
        <!-- Profile Photo (Floating at the top) -->
        <div class="absolute -top-20 left-1/2 -translate-x-1/2">
            <div class="relative w-36 h-36 rounded-full p-1.5 bg-gradient-to-tr from-amber-400 to-rose-400 shadow-xl">
                <!-- 💡 替換照片說明：請將下方 src="..." 內的網址替換為您的真實個人照片網址或檔案路徑 -->
                <img src="https://placehold.co/400x400/fda085/ffffff?text=Photo" alt="王純琳的照片" class="w-full h-full object-cover rounded-full border-4 border-white bg-white">
            </div>
        </div>

        <!-- Header Info -->
        <div class="mt-8 space-y-2">
            <h1 class="text-3xl font-black text-gray-800 tracking-wide">王純琳</h1>
            <p class="text-sm font-bold text-rose-500 bg-rose-50 inline-block px-3 py-1 rounded-full">
                黎明技術學院 數位多媒體系
            </p>
            <p class="text-gray-500 text-sm mt-4 font-medium leading-relaxed max-w-[250px] mx-auto">
                「喜歡簡單生活，也喜歡學中文。」
            </p>
        </div>

        <hr class="my-6 border-gray-100">

        <!-- Skills & Interests -->
        <div class="space-y-5 text-left">
            <!-- Interests -->
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 text-center">我的興趣</h3>
                <div class="flex flex-wrap justify-center gap-2">
                    <span class="px-4 py-1.5 bg-orange-100 text-orange-600 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm hover:scale-105 transition-transform">
                        <i class="fa-solid fa-microphone-lines"></i> 唱歌
                    </span>
                    <span class="px-4 py-1.5 bg-sky-100 text-sky-600 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm hover:scale-105 transition-transform">
                        <i class="fa-solid fa-headphones"></i> 聽音樂
                    </span>
                </div>
            </div>

            <!-- Skills -->
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 text-center">我的技能</h3>
                <div class="flex flex-wrap justify-center gap-2">
                    <span class="px-4 py-1.5 bg-teal-100 text-teal-600 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm hover:scale-105 transition-transform">
                        <i class="fa-solid fa-person-swimming"></i> 游泳
                    </span>
                    <span class="px-4 py-1.5 bg-indigo-100 text-indigo-600 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm hover:scale-105 transition-transform">
                        <i class="fa-solid fa-calculator"></i> 微積分
                    </span>
                </div>
            </div>
        </div>

        <hr class="my-6 border-gray-100">

        <!-- Contact Section -->
        <div>
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 text-center">聯繫方式</h3>
            <div class="flex justify-center gap-4">
                
                <!-- Email Button -->
                <button onclick="copyToClipboard('bd1151016@venus.lit.edu.tw', 'Email')" class="w-12 h-12 rounded-2xl bg-gray-50 text-gray-600 hover:bg-rose-500 hover:text-white hover:shadow-lg hover:shadow-rose-200 transition-all flex items-center justify-center text-xl group" title="複製 Email">
                    <i class="fa-solid fa-envelope group-hover:scale-110 transition-transform"></i>
                </button>

                <!-- Line Button -->
                <button onclick="copyToClipboard('sweettyi3', 'Line ID')" class="w-12 h-12 rounded-2xl bg-gray-50 text-gray-600 hover:bg-green-500 hover:text-white hover:shadow-lg hover:shadow-green-200 transition-all flex items-center justify-center text-xl group" title="複製 Line ID">
                    <i class="fa-brands fa-line group-hover:scale-110 transition-transform"></i>
                </button>

                <!-- Instagram Button -->
                <a href="https://instagram.com/yustfeels_" target="_blank" rel="noopener noreferrer" class="w-12 h-12 rounded-2xl bg-gray-50 text-gray-600 hover:bg-gradient-to-tr hover:from-amber-400 hover:via-rose-500 hover:to-fuchsia-600 hover:text-white hover:shadow-lg hover:shadow-rose-200 transition-all flex items-center justify-center text-xl group" title="前往 Instagram">
                    <i class="fa-brands fa-instagram group-hover:scale-110 transition-transform"></i>
                </a>

            </div>
        </div>
    </main>

    <!-- Script for copy to clipboard and toast -->
    <script>
        function copyToClipboard(text, type) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast(`已成功複製 ${type} !`);
            } catch (err) {
                showToast('複製失敗，請手動選取複製');
            }
            
            document.body.removeChild(textarea);
        }

        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
